# ============================================================
# SentinelPulse — Docker Compose Infrastructure
#
# This file defines the three infrastructure containers
# that SentinelPulse depends on:
#   1. MACHAREDIS   — Redis-Stack (data store + RedisInsight)
#   2. MACHAPROMETHEUS — Prometheus (metrics scraper)
#   3. MACHAGRAFANA — Grafana (metrics dashboard)
#
# HOW TO USE:
#   Start:  docker-compose up -d
#   Stop:   docker-compose down
#   Logs:   docker-compose logs -f
#
# NOTE: If your containers are already running (MACHAREDIS,
# MACHAPROMETHEUS, MACHAGRAFANA), you do NOT need to run this.
# This file exists so you can recreate the full infrastructure
# from scratch with a single command if needed.
#
# PORT MAPPINGS (host:container):
#   Redis:      6000:6379  (app connects to localhost:6000)
#   RedisInsight: 8000:8001  (browser: http://localhost:8000)
#   Prometheus: 9000:9090  (browser: http://localhost:9000)
#   Grafana:    2500:3000  (browser: http://localhost:2500)
# ============================================================

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis-Stack: The central data store for all SentinelPulse state.
  # Stores: API keys, rate-limit token buckets, route definitions,
  # subscriber registrations, idempotency hashes, and the DLQ.
  # Includes RedisInsight Web UI for visual inspection.
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis/redis-stack:latest
    container_name: MACHAREDIS
    restart: unless-stopped
    ports:
      - "6000:6379"    # Redis client port (SentinelPulse connects here)
      - "8000:8001"    # RedisInsight Web UI → http://localhost:8000
    environment:
      # requirepass: password for authentication
      # save 60 1: persist to disk if 1+ key changed in 60 seconds
      # appendonly yes: append-only file for durability
      - REDIS_ARGS=--requirepass reddocis697! --save 60 1 --appendonly yes

  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus: Scrapes /actuator/prometheus every 15 seconds and stores metrics.
  # Configuration comes from prometheus.yml in the project root.
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: MACHAPROMETHEUS
    restart: unless-stopped
    ports:
      - "9000:9090"    # Prometheus Web UI → http://localhost:9000
    volumes:
      # Mount the prometheus.yml scrape configuration (read-only)
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # ─────────────────────────────────────────────────────────────────────────────
  # Grafana: Visual dashboard builder — connects to Prometheus as a data source.
  # Default login: admin / admin
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: MACHAGRAFANA
    restart: unless-stopped
    ports:
      - "2500:3000"    # Grafana Web UI → http://localhost:2500
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafdok697!
