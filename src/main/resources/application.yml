server:
  port: 8080

spring:
  application:
    name: sentinelpulse
  data:
    redis:
      host: localhost
      port: 6000
      password: reddocis697!
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 1000ms

# ─────────────────────────────────────────────────────────────────────────────
# SentinelPulse Custom Properties
# ─────────────────────────────────────────────────────────────────────────────
sentinelpulse:
  rate-limit:
    default-capacity: 10          # max tokens per client (global fallback)
    default-refill-rate: 2        # tokens refilled per second (global fallback)

  executor:
    core-pool-size: 10
    max-pool-size: 50
    queue-capacity: 200
    thread-name-prefix: "webhook-worker-"

  webhook:
    max-retries: 3
    backoff-base-ms: 2000         # Attempt 1: 2s, Attempt 2: 4s, Attempt 3: 8s

  idempotency:
    ttl-seconds: 86400            # 24-hour deduplication window

# ─────────────────────────────────────────────────────────────────────────────
# Spring Boot Actuator & Micrometer
# ─────────────────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: sentinelpulse
      environment: development
